[package]
name = "eva-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSGeometry", "NSRunLoop", "NSDate"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSPanel",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSTextField",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSWorkspace",
    "NSRunningApplication",
    "NSScreen",
    "NSColor",
    "NSFont",
    "NSResponder",
] }
objc2-core-graphics = "0.3"
thiserror = { workspace = true }
tracing = { workspace = true }

[dependencies]
serde = { workspace = true }
