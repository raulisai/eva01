# EVA01 — configuración
#
# Todo es opcional: lo que no escribas aquí usa el valor de abajo. Quita el
# «#» de una línea para cambiarla y reinicia EVA01. Si algo tiene un error de
# tipeo, EVA01 te lo dice (`eva doctor`) y usa los valores por defecto.

# La palabra que convierte lo dictado en una orden ("Adán, abre Brave").
# `eva wake-word <palabra>` la cambia sin editar este archivo y gana sobre esta.
# wake_word = "Adán"

[hotkey]
# La tecla de dictado, mantenida mientras hablas. "fn" es la tecla fn / 🌐
# (en Ajustes del Sistema → Teclado, "Pulsar la tecla 🌐 para" debe estar en
# "No hacer nada"). También sirve una combinación: "cmd+shift+space", "alt+space".
# dictation = "fn"
# Mientras EVA01 te hace una pregunta en pantalla: sí / no (nunca por voz).
# confirm = "cmd+return"
# cancel = "cmd+escape"
# Marca el último dictado como mal transcrito: guarda su audio y su texto para
# el corpus de pruebas (eval/README.md). Siempre disponible en el menú también.
# flag_bad = "ctrl+alt+cmd+m"

[stt]
# Modelo de voz. Sin esto EVA01 busca en ~/Library/Application Support/EVA01/models:
# primero canary-1b-flash, luego canary-180m-flash, luego cualquier *.bin de Whisper.
# canary_dir = "~/Library/Application Support/EVA01/models/canary-1b-flash"
# whisper_path = "~/Library/Application Support/EVA01/models/ggml-base.bin"
# language = "es"
# Con canary-1b-flash, usar también canary-180m-flash (si está instalado) para
# volver a oír las frases cortas: el grande confunde a menudo la palabra de
# activación en órdenes de 1-2 s. Unos 250 MB más de memoria.
# second_opinion = true
# Qué rodea la grabación antes de que Canary la oiga: "auto" (por defecto: silencio
# digital solo si el fondo de la propia grabación es silencioso), "silence" o "none".
# Mídelo con tus propios dictados marcados (eval/README.md, eva-eval --padding).
# padding = "auto"

[agents]
# Qué agente probar primero. Si falla antes de hacer algo, se prueba el siguiente.
# "usa Claude y…" o "usa Codex y…" fuerzan uno.
# priority = ["codex", "claude_code"]
# Cada tarea corre en un worktree de git propio (rama eva/xxxx): lo que el agente
# malentienda no toca tu árbol. Si no hay repositorio, corre en el proyecto mismo.
# worktree = true
# Proyecto a usar cuando la ventana enfocada no dice cuál.
# default_project = "~/code/mi-proyecto"
# Carpetas cuyos repositorios EVA01 conoce (y reconoce por el título de la ventana).
# project_roots = ["~/code", "~/Developer", "~/projects"]

# Qué deja pasar el gateway, qué pregunta y qué rechaza: "auto", "confirm" o "block".
# Acciones: open_app, close_app, open_url, web_search, insert_text, agent_task,
# edit_selection, read_selection, notify, speak.
# Hay reglas que esta configuración no puede aflojar (cerrar Finder, enlaces
# javascript:, pegar varias líneas por un agente…).
[gateway.voice]
# lo que pides por voz (todo "auto" por defecto)
# agent_task = "confirm"

[gateway.agent]
# lo que un agente pide por las herramientas MCP de EVA
# (por defecto close_app, insert_text y read_selection piden confirmación)
# open_url = "confirm"

[gateway]
# Cuánto espera una pregunta en pantalla antes de contar como "no".
# confirm_timeout_secs = 30

[feedback]
# Voz de `say -v '?'` para avisar cuando una tarea termina.
# voice = "Mónica"
# speak_task_results = true
# notify_task_results = true
# Segundos antes de detener una tarea de agente; 0 = sin límite.
# task_timeout_secs = 1800
# Milisegundos que la flecha de la isla se ve antes de que el texto aparezca
# donde dictas (luego sigue subiendo un instante). 0 = pegar al instante, sin
# esperar nada; la flecha sale igual.
# send_animation_ms = 120

[dictation]
# Un espacio después de cada dictado, para que el siguiente no se pegue.
# trailing_space = true
# Corrige el inglés técnico que el modelo escribe como español: «book» → «bug»,
# «dash board» → «dashboard», «u i» → «UI». Solo grafías que no son palabras del español.
# tech_glossary = true
# polish = true          # segunda pasada con el modelo local de [resolver]: autocorrecciones y términos técnicos
# pause_media = true      # pausa la música y silencia el Mac mientras dictas; lo devuelve al soltar

[history]
# Guardar el texto de cada dictado en este equipo (crudo y formateado). Es lo que
# permite marcar uno como mal transcrito después. En false no se escribe nada.
# save_transcripts = true
# Días que se conservan; los marcados como mal transcritos no se borran. 0 = todo.
# keep_days = 30
# Modo entrenamiento: guarda también el AUDIO de cada dictado y orden en este Mac
# (carpeta training/), para revisarlos en el panel («Revisar») y medir con tu voz.
# Apagado por defecto; el interruptor del panel manda sobre esta línea.
# save_audio = false

[styles]
# Estilo de puntuación por app (además de los que ya trae EVA01: chat, correo,
# terminales). Estilos: "default", "casual", "formal", "terminal".
# apps = [
#   { bundle_id = "com.tinyspeck.slackmacgap", style = "casual" },
# ]

# Tus propias órdenes: «Adán, mi correo». Cada una hace UNA cosa: `insert` pega un
# texto, `open` abre apps y/o direcciones web (en orden), `task` se lo da a un agente.
# Pasan por el mismo gateway que cualquier orden (una `task` pregunta antes si
# [gateway.voice] agent_task = "confirm"). Acentos, mayúsculas y puntuación no importan.
# `also` = otras formas de decir lo mismo. También puedes poner órdenes, una por archivo,
# en la carpeta commands/ junto a este archivo (`eva commands path`; `eva commands` las lista).
# [[commands]]
# say = "mi correo"
# insert = "yo@ejemplo.com"
#
# [[commands]]
# say = "modo enfoque"
# open = ["Notion", "Spotify", "https://calendar.google.com"]
#
# [[commands]]
# say = "revisa los tests"
# task = "corre los tests del proyecto y dime cuáles fallan y por qué"

[remote]
# Modelo remoto compatible con OpenAI para editar texto o formatear. APAGADO por
# defecto: los dictados llevan secretos y nada sale de tu Mac salvo que lo actives.
# La clave NO va aquí, sino en la variable de entorno que nombres en api_key_env.
# enabled = false
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# model = "gpt-4o-mini"
# use_for = ["edit"]   # "edit" (reescribir selección) y/o "format" (cada dictado)

[resolver]
# Cuando «abre <algo>» no coincide con ninguna app, un modelo local pequeño decide
# cuál de TUS apps quisiste decir («breve» → Brave) y EVA01 lo recuerda. Solo se usa
# un servidor de esta Mac (Ollama); nada sale de tu equipo. Si no responde, se omite.
# Instalar el modelo:  ollama pull qwen2.5:3b   (y tener Ollama abierto)
# enabled = true
# base_url = "http://127.0.0.1:11434/v1"
# model = "qwen2.5:3b"
# Lo mismo para pedidos largos que ninguna regla entiende («abre YouTube y busca música
# chill», «pon música para concentrarme»): el modelo propone los pasos, EVA01 te los
# muestra y, si dices que sí, los ejecuta (cada paso pasa por el gateway como siempre).
# planner = true
# confirm_plans = true   # false: ejecutarlos sin preguntar
