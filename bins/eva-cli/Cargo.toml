[package]
# The crate is named `eva-cli` (matching every other package in this
# workspace's `eva-*` naming) but the binary it produces is plain `eva` —
# `docs/PLAN.md` §3.1: "eva intent \"abre brave\"", not "eva-cli intent …".
name = "eva-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "eva"
path = "src/main.rs"

[dependencies]
eva-ipc = { workspace = true }
eva-config = { workspace = true }
eva-store = { workspace = true }
eva-agents = { workspace = true }
eva-audio = { workspace = true }
eva-text = { workspace = true }
eva-macos = { workspace = true }
transcribe-rs = { version = "0.3", features = ["whisper-cpp", "onnx"] }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
uuid = { workspace = true }
dirs = "5"
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
